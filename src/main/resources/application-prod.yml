spring:
  datasource:
    # All values must come from the environment in production; no defaults.
    url: ${DB_URL:jdbc:mariadb://172.18.86.78:3306/PPWIRE}
    username: ${DB_USERNAME:ppwiredb1}
    password: ${DB_PASSWORD:ppwiredb123!@}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:5}
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          fetch_size: 50
          batch_size: 20
        order_inserts: true
        order_updates: true

server:
  port: ${SERVER_PORT:8081}
  # TLS: enable by supplying a keystore via environment variables.
  ssl:
    enabled: ${SERVER_SSL_ENABLED:false}
    key-store: ${SERVER_SSL_KEYSTORE:}
    key-store-password: ${SERVER_SSL_KEYSTORE_PASSWORD:}
    key-store-type: ${SERVER_SSL_KEYSTORE_TYPE:PKCS12}

logging:
  level:
    root: INFO
    com.lra: INFO
  file:
    name: ${LOG_FILE:logs/application.log}
