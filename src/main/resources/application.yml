spring:
  application:
    name: local-runtime-agent

  datasource:
    url: ${DB_URL:jdbc:mariadb://172.18.86.78:3306/PPWIRE}
    driver-class-name: org.mariadb.jdbc.Driver
    username: ${DB_USERNAME:ppwiredb1}
    password: ${DB_PASSWORD:ppwiredb123!@}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          time_zone: Asia/Seoul
          fetch_size: 50
          batch_size: 20
        order_inserts: true
        order_updates: true

server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: /

agent:
  auto-register: ${AGENT_AUTO_REGISTER:true}
  ip-address: ${AGENT_IP_ADDRESS:}
  polling-interval-sec: ${AGENT_POLLING_INTERVAL_SEC:30}
  health-check-interval-sec: ${AGENT_HEALTH_CHECK_INTERVAL_SEC:30}

logging:
  level:
    root: INFO
    com.lra: DEBUG
    org.hibernate.SQL: DEBUG
  file:
    name: logs/application.log
