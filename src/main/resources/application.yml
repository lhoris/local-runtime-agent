spring:
  application:
    name: local-runtime-agent

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:agent_db}?serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

agent:
  id: ${AGENT_ID:agent-${HOSTNAME:${COMPUTERNAME:unknown}}}
  polling-interval-sec: ${AGENT_POLLING_INTERVAL_SEC:30}
  health-check-interval-sec: ${AGENT_HEALTH_CHECK_INTERVAL_SEC:30}

logging:
  level:
    root: INFO
    com.lra: DEBUG
  file:
    name: logs/application.log
