spring:
  application:
    name: local-runtime-agent

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:agent_db}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

agent:
  id: ${AGENT_ID:agent-${HOSTNAME:${COMPUTERNAME:unknown}}}
  polling-interval-sec: ${AGENT_POLLING_INTERVAL_SEC:30}
  health-check-interval-sec: ${AGENT_HEALTH_CHECK_INTERVAL_SEC:30}

logging:
  level:
    root: INFO
    com.lra: DEBUG
  file:
    name: logs/application.log
