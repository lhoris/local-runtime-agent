spring:
  application:
    name: local-runtime-agent

  datasource:
    url: jdbc:mariadb://${DB_HOST:central-db}:${DB_PORT:3306}/${DB_NAME:agent_db}?serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USER:agent}
    password: ${DB_PASSWORD:agent}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

agent:
  auto-register: ${AGENT_AUTO_REGISTER:true}
  ip-address: ${AGENT_IP_ADDRESS:}
  polling-interval-sec: ${AGENT_POLLING_INTERVAL_SEC:30}
  health-check-interval-sec: ${AGENT_HEALTH_CHECK_INTERVAL_SEC:30}

logging:
  level:
    root: INFO
    com.lra: DEBUG
    org.hibernate.SQL: DEBUG
  file:
    name: logs/application.log
