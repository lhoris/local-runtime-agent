spring:
  datasource:
    url: jdbc:mariadb://${DB_HOST:central-db}:${DB_PORT:3306}/${DB_NAME:agent_db}?serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USER:agent}
    password: ${DB_PASSWORD:agent}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: true

logging:
  level:
    root: INFO
    com.lra: DEBUG
    org.hibernate.SQL: DEBUG
