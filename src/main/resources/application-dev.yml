spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:agent_db}
    username: ${DB_USER:agent}
    password: ${DB_PASSWORD:agent}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: INFO
    com.lra: DEBUG
    org.flywaydb: DEBUG
    org.hibernate.SQL: DEBUG
