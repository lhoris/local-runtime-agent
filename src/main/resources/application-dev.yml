spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:agent_db}?serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USER:agent}
    password: ${DB_PASSWORD:agent}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

logging:
  level:
    root: INFO
    com.lra: DEBUG
    org.flywaydb: DEBUG
    org.hibernate.SQL: DEBUG
